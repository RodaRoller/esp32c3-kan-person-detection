[platformio]
default_envs = c3_supermini

[env:c3_supermini]
platform = platformio/espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
board_build.f_cpu = 160000000L
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.before_reset = usb_reset
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -fno-fast-math
    -ffp-contract=off
